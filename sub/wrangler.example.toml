# Reference wrangler.toml for the sub worker. The committed `wrangler.toml` is
# safe to copy as-is; sensitive VEILWEAVE_NODES and SUBSCRIPTION_TOKEN values
# are intentionally absent. The KV id remains a non-secret placeholder.
#
# Steps to get a real one:
#   1. cargo run --manifest-path tools/Cargo.toml -- gen-secret
#   2. wrangler kv:namespace create <YOUR_NAMESPACE_NAME>   # paste id below;
#      rename the binding too and set KV_BINDING to its name (recommended)
#   3. wrangler secret put VEILWEAVE_NODES
#   4. wrangler secret put SUBSCRIPTION_TOKEN

name = "veilweave-sub"
main = "build/index.js"
compatibility_date = "2026-05-26"
compatibility_flags = ["nodejs_compat"]

[build]
command = "cargo install -q \"worker-build@^0.8\" && worker-build --release"
cwd = "."

[[kv_namespaces]]
binding = "VEILWEAVE_KV"
id = "REPLACE_ME_WITH_KV_NAMESPACE_ID"

# Sensitive bindings are intentionally absent from this file.
# Set them with Wrangler's secret commands before deployment.
[vars]
MAX_NODES = "100"
FP = "chrome"
DISABLE_BUILTIN_PROXYIP = "false"
