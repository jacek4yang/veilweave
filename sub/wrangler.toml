name = "veilweave-sub"
main = "build/index.js"
compatibility_date = "2026-05-26"
compatibility_flags = ["nodejs_compat"]

[build]
command = "cargo install -q \"worker-build@^0.8\" && worker-build --release"
cwd = "."

# Refresh the authoritative proxyIP dataset every six hours. The deployer also
# performs an authenticated bootstrap refresh before reporting the Sub healthy.
[triggers]
crons = ["17 */6 * * *"]

# Subscriptions are read-heavy and cache-heavy; KV is the right backing store.
# Pick your OWN namespace title (avoid the predictable default) and rename the
# binding to match: run `wrangler kv:namespace create <YOUR_NAMESPACE_NAME>`,
# paste the id below, and if you rename the binding, set the `KV_BINDING` var
# to its name (resolution order: KV_BINDING → VEILWEAVE_KV → KV; KV optional).
[[kv_namespaces]]
binding = "VEILWEAVE_KV"
id = "REPLACE_ME_WITH_KV_NAMESPACE_ID"

# The singleton refresher performs the 12+ MiB source parse with a Durable
# Object's 30-second CPU allowance and serializes scheduled/manual refreshes.
[[durable_objects.bindings]]
name = "PROXYIP_REFRESHER"
class_name = "ProxyIpRefresher"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProxyIpRefresher"]

# Relay nodes for load balancing. Each node is `domain|secret`, comma-separated.
# DEFAULT (plaintext, `encryption=none`): `secret` is the raw shared secret from
# `veilweave-tools gen-secret` (must equal the relay's SECRET_KEY).
# EXPERIMENTAL encryption: use the SUB blob from `gen-secret --encryption` —
# the subscription then signs each node's UUID with the blob's UUID secret AND
# advertises VLESS Encryption from the blob's X25519 public key, so links become
# `encryption=mlkem768x25519plus.native.1rtt.<pubkey>` automatically.
#
# Multiple nodes, comma-separated:
#   VEILWEAVE_NODES = "node-a.example.com|<secret a>,node-b.example.com|<secret b>"
# Set with: wrangler secret put VEILWEAVE_NODES

# Subscription access token (independent of any relay secret).
# For production, prefer:  wrangler secret put SUBSCRIPTION_TOKEN
# Set with: wrangler secret put SUBSCRIPTION_TOKEN

[vars]

# Maximum number of nodes to return in a single subscription response.
MAX_NODES = "100"

# TLS fingerprint advertised to clients.
FP = "chrome"

# KV binding name override. Set this if you renamed the [[kv_namespaces]]
# binding above to your own (recommended, non-default) name.
# KV_BINDING = "MY_KV"

# ECH is disabled by default for broad client compatibility. Advanced users may
# opt in with an explicit, client-compatible ECH value.
# ECH = "example-ech-config"
