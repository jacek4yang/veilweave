[package]
name = "veilweave-app"
version = "1.1.1"
edition = "2021"
description = "veilweave desktop — one-click Cloudflare Workers deployment"
build = "build.rs"

[lib]
name = "veilweave_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "veilweave-app"
path = "src/main.rs"

[build-dependencies]
anyhow = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
veilweave-core = { path = "../../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt", "time", "macros"] }
