[package]
name = "veilweave-app"
version = "2.0.2"
edition = "2021"
description = "veilweave desktop — one-click Cloudflare Workers deployment"
build = "build.rs"

[lib]
name = "veilweave_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "veilweave-app"
path = "src/main.rs"

[build-dependencies]
anyhow = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "=2.10.1"
tauri-plugin-opener = "2"
# Feature-unifies the updater's reqwest 0.13 client with real SOCKS5/SOCKS5H
# support. The updater still performs its normal signature verification.
reqwest = { version = "=0.13.4", default-features = false, features = ["socks"] }
veilweave-core = { path = "../../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt", "time", "macros"] }
uuid = "1"
