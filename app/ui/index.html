<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>veilweave</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- ── sidebar ─────────────────────────────────────────── -->
    <aside id="sidebar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
          <defs>
            <linearGradient id="gA" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/>
            </linearGradient>
          </defs>
          <path d="M5 24 Q24 8 43 24" fill="none" stroke="url(#gA)" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M5 24 Q24 40 43 24" fill="none" stroke="url(#gA)" stroke-width="2.6" stroke-linecap="round" opacity=".85"/>
          <path d="M8 24 Q24 14 40 24" fill="none" stroke="url(#gA)" stroke-width="1.8" stroke-linecap="round" opacity=".55"/>
          <path d="M8 24 Q24 34 40 24" fill="none" stroke="url(#gA)" stroke-width="1.8" stroke-linecap="round" opacity=".55"/>
          <circle cx="24" cy="24" r="3.4" fill="#e0f2fe"/>
        </svg>
        <span class="brand-name">veilweave</span>
      </div>

      <nav id="nav">
        <button class="nav-item" data-nav="overview">
          <svg viewBox="0 0 20 20"><path d="M3 10.5 10 4l7 6.5M5 9.5V16h10V9.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-i18n="nav.overview"></span>
        </button>
        <button class="nav-item" data-nav="accounts">
          <svg viewBox="0 0 20 20"><circle cx="10" cy="6.5" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 16.5c.8-3 3.4-4.5 6.5-4.5s5.7 1.5 6.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span data-i18n="nav.accounts"></span>
        </button>
        <button class="nav-item" data-nav="deploy">
          <svg viewBox="0 0 20 20"><path d="M10 2.5 16.5 6v8L10 17.5 3.5 14V6L10 2.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 10v7.5M10 10 3.5 6M10 10l6.5-4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          <span data-i18n="nav.deploy"></span>
        </button>
        <button class="nav-item" data-nav="manage">
          <svg viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="11" width="14" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="6.2" cy="6" r=".9" fill="currentColor"/><circle cx="6.2" cy="14" r=".9" fill="currentColor"/></svg>
          <span data-i18n="nav.manage"></span>
        </button>
        <button class="nav-item" data-nav="settings">
          <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2.8v2M10 15.2v2M17.2 10h-2M4.8 10h-2M15.1 4.9l-1.4 1.4M6.3 13.7l-1.4 1.4M15.1 15.1l-1.4-1.4M6.3 6.3 4.9 4.9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span data-i18n="nav.settings"></span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <button id="lang-toggle" class="lang-toggle" title="Language / 语言"></button>
        <div class="version" id="sidebar-version"></div>
      </div>
    </aside>

    <!-- ── main ────────────────────────────────────────────── -->
    <main id="main">
      <section class="page" data-page="overview"></section>
      <section class="page" data-page="accounts"></section>
      <section class="page" data-page="deploy"></section>
      <section class="page" data-page="manage"></section>
      <section class="page" data-page="settings"></section>
    </main>
  </div>

  <div id="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
