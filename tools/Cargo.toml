[package]
name = "veilweave-tools"
version = "1.0.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
rand = "0.8"
base64 = "0.22"
x25519-dalek = { version = "2", features = ["static_secrets"] }

# Deploy core (cfapi / config / deploy / wizard). anyhow is used by the new
# modules only; the pre-existing code keeps its expect() style.
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "multipart",
] }
tokio = { version = "1", features = ["full"] }
dialoguer = "0.11"

# GUI (glow backend only — no wgpu). `open` opens the system browser.
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "default_fonts",
] }
open = "5"

[dev-dependencies]
# Headless GUI smoke tests (logic only — no wgpu renderer).
egui_kittest = { version = "0.36", default-features = false, features = ["eframe"] }
