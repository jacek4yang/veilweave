[package]
name = "veilweave-tools"
version = "2.0.2"
edition = "2021"

[dependencies]
# Shared deploy core (Cloudflare API client, config, orchestration).
veilweave-core = { path = "../core" }

clap = { version = "4", features = ["derive"] }
rand = "0.8"
base64 = "0.22"
x25519-dalek = { version = "2", features = ["static_secrets"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
dialoguer = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = "1"
