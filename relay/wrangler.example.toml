# This is the **reference** wrangler.toml. The committed `wrangler.toml` is
# safe to copy as-is and contains no SECRET_KEY value.
# For local dev or staging you can `cp wrangler.example.toml wrangler.toml`.
#
# For production, use the secret-store path:
#     wrangler secret put SECRET_KEY
# The value is intentionally absent from this file.

name = "veilweave"
main = "build/index.js"
compatibility_date = "2026-05-26"
compatibility_flags = ["nodejs_compat"]

[build]
command = "cargo install -q \"worker-build@^0.8\" && worker-build --release"
cwd = "."

[observability]
enabled = true

# Set with: wrangler secret put SECRET_KEY

[[durable_objects.bindings]]
name = "VEILWEAVE_SESSION"
class_name = "VeilweaveSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VeilweaveSession"]
