name = "veilweave"
main = "build/index.js"
compatibility_date = "2026-05-26"
compatibility_flags = ["nodejs_compat"]

[build]
# Production build: no logging compiled in (zero hot-path overhead). To profile a
# deploy with `wrangler tail`, build with `--features perf-log` and tail live:
#   cd relay
#   worker-build --release --features perf-log
#   wrangler deploy
#   wrangler tail
# See src/log.rs for the on/off semantics. Turn it back off for long-term use.
command = "cargo install -q \"worker-build@^0.8\" && worker-build --release"
cwd = "."

# Surface uncaught errors / console output in the dashboard. Workers Logs is
# available on the free plan (sampled), and costs nothing while idle.
[observability]
enabled = true

# ─── Configuration ───────────────────────────────────────────────────────────
# `SECRET_KEY` is the SINGLE configuration value. The DEFAULT — and the mode
# recommended for the Workers free CPU limits — is PLAINTEXT VLESS: set any
# plain random secret string below. It seeds the UUID-signing codec only; the
# data path is then a pure passthrough with zero crypto and zero handshake.
#
# VLESS Encryption (post-quantum, forward-secret — `mlkem768x25519plus`) is an
# EXPERIMENTAL opt-in, and CPU-heavy on the free plan: generate a matched blob
# pair with `veilweave-tools gen-secret --encryption` (see tools/README.md) and
# paste the **relay blob** below. The blob carries both the UUID-signing secret
# AND the X25519 private key the encryption handshake needs, so PQ-PFS is
# enabled automatically — no extra variables.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  ⚠️  NEVER commit a real secret to this file.                             │
# │  For production, run:                                                    │
# │      wrangler secret put SECRET_KEY                                      │
# │  The value is intentionally absent from this committed file.             │
# └─────────────────────────────────────────────────────────────────────────┘

# ─── Durable Object: per-connection VLESS session ───────────────────────────
# Every WS connection (plaintext or encrypted) is handled by its own
# `VeilweaveSession` instance under the WebSocket Hibernation API, so each
# inbound frame gets its own CPU budget — the key to staying under the free
# plan's per-invocation 10 ms CPU cap on bulk upload.
[[durable_objects.bindings]]
name = "VEILWEAVE_SESSION"
class_name = "VeilweaveSession"

# Free-plan Durable Objects REQUIRE the SQLite storage backend, so the class
# must be introduced with `new_sqlite_classes` (not `new_classes`, which is
# paid key-value storage). VeilweaveSession keeps only in-memory connection
# state and never touches storage, but the SQLite backend is still the one
# the free plan allows.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["VeilweaveSession"]
