name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        working-directory: relay
        run: cargo fmt --all -- --check
      - name: Check formatting (sub)
        working-directory: sub
        run: cargo fmt --all -- --check
      - name: Check formatting (tools)
        working-directory: tools
        run: cargo fmt --all -- --check

  relay-check:
    name: relay · cargo check (wasm)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay -> target
      - name: cargo check
        working-directory: relay
        run: cargo check --target wasm32-unknown-unknown --release

  sub-check:
    name: sub · cargo check (wasm)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sub -> target
      - name: cargo check
        working-directory: sub
        run: cargo check --target wasm32-unknown-unknown --release

  tools-build:
    name: tools · cargo build (native)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI build deps (egui/winit)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev
      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools -> target
      - name: cargo build
        working-directory: tools
        run: cargo build --release
      - name: smoke test — gen-secret
        working-directory: tools
        run: |
          ./target/release/veilweave-tools gen-secret | tee /tmp/secret.txt
          test -s /tmp/secret.txt
          grep -q "relay blob" /tmp/secret.txt || true
          # we accept any non-empty output
          test "$(wc -c < /tmp/secret.txt)" -gt 50

  app-check:
    name: app · cargo check (desktop)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Provide placeholder worker bundle for build.rs
        run: |
          # build.rs requires the embedded bundle layout; the real bytes are only
          # needed for actual release builds (release.yml's workers job). A minimal
          # placeholder is enough for cargo check.
          for unit in relay sub; do
            mkdir -p "app/src-tauri/bundle/$unit/build/worker"
            echo "// ci placeholder" > "app/src-tauri/bundle/$unit/build/index.js"
            : > "app/src-tauri/bundle/$unit/build/index_bg.wasm"
            echo '{}' > "app/src-tauri/bundle/$unit/build/package.json"
            echo "// ci placeholder" > "app/src-tauri/bundle/$unit/build/worker/shim.mjs"
          done
      - name: cargo check
        working-directory: app/src-tauri
        run: cargo check --locked 2>&1 | tail -5
