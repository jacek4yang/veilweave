name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        working-directory: relay
        run: cargo fmt --all -- --check
      - name: Check formatting (sub)
        working-directory: sub
        run: cargo fmt --all -- --check
      - name: Check formatting (tools)
        working-directory: tools
        run: cargo fmt --all -- --check
      - name: Check formatting (core)
        working-directory: core
        run: cargo fmt --all -- --check
      - name: Check formatting (app)
        working-directory: app/src-tauri
        run: cargo fmt --all -- --check
      - name: Check version consistency
        run: python3 scripts/check_version.py

  core-test:
    name: core · check, clippy, test
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install credential-store build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target
      - working-directory: core
        run: cargo check --locked --all-targets
      - working-directory: core
        run: cargo clippy --locked --all-targets -- -D warnings
      - working-directory: core
        run: cargo test --locked --all-targets

  relay-check:
    name: relay · cargo check (wasm)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay -> target
      - name: cargo check
        working-directory: relay
        run: cargo check --locked --target wasm32-unknown-unknown --release
      - name: cargo clippy
        working-directory: relay
        run: cargo clippy --locked --target wasm32-unknown-unknown --release -- -D warnings
      - name: cargo test
        working-directory: relay
        run: cargo test --locked

  sub-check:
    name: sub · cargo check (wasm)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sub -> target
      - name: cargo check
        working-directory: sub
        run: cargo check --locked --target wasm32-unknown-unknown --release
      - name: cargo clippy
        working-directory: sub
        run: cargo clippy --locked --target wasm32-unknown-unknown --release -- -D warnings
      - name: cargo test
        working-directory: sub
        run: cargo test --locked

  tools-build:
    name: tools · cargo build (native)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI build deps (egui/winit)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libdbus-1-dev pkg-config
      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools -> target
      - name: cargo check, clippy, and test
        working-directory: tools
        run: |
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo build --release --locked

  app-check:
    name: app · cargo check (desktop)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev \
            libdbus-1-dev pkg-config
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Provide placeholder worker bundle for build.rs
        run: |
          for unit in relay sub; do
            mkdir -p "/tmp/vw-build-$unit/worker"
            echo "// ci placeholder" > "/tmp/vw-build-$unit/index.js"
            : > "/tmp/vw-build-$unit/index_bg.wasm"
            echo '{}' > "/tmp/vw-build-$unit/package.json"
            echo "// ci placeholder" > "/tmp/vw-build-$unit/worker/shim.mjs"
            cargo run --locked --manifest-path tools/Cargo.toml -- worker-bundle prepare \
              --role "$unit" --source "/tmp/vw-build-$unit" \
              --out "app/src-tauri/bundle/$unit"
          done
      - name: cargo check, clippy, and test
        working-directory: app/src-tauri
        run: |
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets

  worker-bundle:
    name: workers · real build and canonical bundle
    runs-on: ubuntu-latest
    needs: [fmt, core-test]
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-worker-build
          workspaces: |
            relay -> target
            sub -> target
            tools -> target
      - name: Install worker-build
        run: cargo install --locked worker-build --version 0.8.5
      - name: Build exact Worker outputs
        run: |
          (cd relay && worker-build --release)
          (cd sub && worker-build --release)
      - name: Prepare and validate exact runtime bundles
        run: |
          cargo run --locked --manifest-path tools/Cargo.toml -- worker-bundle prepare --role relay --source relay/build --out stage/relay
          cargo run --locked --manifest-path tools/Cargo.toml -- worker-bundle prepare --role sub --source sub/build --out stage/sub
          cargo run --locked --manifest-path tools/Cargo.toml -- worker-bundle validate --role relay --dir stage/relay
          cargo run --locked --manifest-path tools/Cargo.toml -- worker-bundle validate --role sub --dir stage/sub
          test ! -e stage/relay/package.json
          test ! -e stage/sub/package.json
