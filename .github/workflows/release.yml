name: Release

# Tag push (v*) builds and publishes a GitHub Release containing:
#   veilweave-tools[.exe] zips  — CLI deployer + PREBUILT workers (per platform)
#   desktop app installers      — NSIS+MSI (Windows), DMG (macOS arm64),
#                                 AppImage+deb (Linux), plus updater sigs and
#                                 latest.json for in-app auto-update
# End users never touch a Rust toolchain, Node, or wrangler.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v2.0.0)"
        required: true
        default: "v2.0.0"

env:
  CARGO_TERM_COLOR: always

jobs:
  live-e2e:
    name: protected Cloudflare runtime proof
    uses: ./.github/workflows/cloudflare-smoke.yml
    with:
      resource_prefix: vw-smoke-release
      confirm_cleanup: DELETE-TEST-RESOURCES

  tools:
    name: tools · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: live-e2e
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64, ext: ".exe" }
          - { os: ubuntu-latest,  name: linux-x64,   ext: "" }
          - { os: macos-latest,   name: macos-arm64, ext: "" }
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI build deps (egui/winit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libdbus-1-dev pkg-config
      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools -> target
      - name: cargo build --release
        working-directory: tools
        run: cargo build --release --locked
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p stage
          cp "tools/target/release/veilweave-tools${{ matrix.ext }}" stage/
      - name: Upload tools artifact
        uses: actions/upload-artifact@v4
        with:
          name: tools-${{ matrix.name }}
          path: stage/
          if-no-files-found: error

  workers:
    name: workers · prebuilt relay + sub bundles
    runs-on: ubuntu-latest
    needs: live-e2e
    steps:
      - uses: actions/checkout@v4
      - name: Install credential-store build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools -> target
      - name: Download exact bundles from the protected E2E job
        uses: actions/download-artifact@v4
        with:
          name: tested-worker-bundles
          path: stage/bundle
      - name: Validate tested bundles
        run: |
          cargo run --release --locked --manifest-path tools/Cargo.toml -- \
            worker-bundle validate --role relay --dir stage/bundle/relay
          cargo run --release --locked --manifest-path tools/Cargo.toml -- \
            worker-bundle validate --role sub --dir stage/bundle/sub
          test ! -e stage/bundle/relay/package.json
          test ! -e stage/bundle/sub/package.json
      - name: Upload worker bundles
        uses: actions/upload-artifact@v4
        with:
          name: worker-bundles
          path: stage/
          if-no-files-found: error

  app:
    name: app · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: workers
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows, bundles: "nsis,msi" }
          - { os: macos-latest,   name: macos,   bundles: "app,dmg" }
          - { os: ubuntu-latest,  name: linux,   bundles: "appimage,deb" }
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Download prebuilt worker bundles
        uses: actions/download-artifact@v4
        with:
          name: worker-bundles
          path: app/src-tauri
      - name: Verify embedded worker bundle
        shell: bash
        run: |
          test -f app/src-tauri/bundle/relay/index.js
          test -f app/src-tauri/bundle/sub/index.js
          test -f app/src-tauri/bundle/relay/worker-manifest.json
          test -f app/src-tauri/bundle/sub/worker-manifest.json
          test ! -e app/src-tauri/bundle/relay/package.json
          test ! -e app/src-tauri/bundle/sub/package.json
      - name: Install Linux app deps (webkit2gtk etc.)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev \
            libdbus-1-dev pkg-config
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: npm ci (tauri-cli)
        working-directory: app
        run: npm ci
      - name: Require updater signing credentials
        shell: bash
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"
      - name: tauri build
        working-directory: app
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}
      - name: Upload app bundles
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.name }}
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/nsis/*.sig
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/macos/*.tar.gz
            app/src-tauri/target/release/bundle/macos/*.sig
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/appimage/*.sig
            app/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  release:
    name: publish GitHub Release
    runs-on: ubuntu-latest
    needs: [tools, workers, app]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag and component versions
        run: |
          python3 scripts/check_version.py
          test "$TAG" = "v$(cat VERSION)"
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Verify updater signatures against the committed public key
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          python3 - <<'PYEOF'
          import base64, json
          config = json.load(open("app/src-tauri/tauri.conf.json", encoding="utf-8"))
          public = base64.b64decode(config["plugins"]["updater"]["pubkey"], validate=True)
          assert public.startswith(b"untrusted comment: minisign public key")
          open("updater.pub", "wb").write(public)
          PYEOF
          shopt -s nullglob
          windows_artifacts=(artifacts/app-windows/nsis/*.exe)
          macos_artifacts=(artifacts/app-macos/macos/*.tar.gz)
          linux_artifacts=(artifacts/app-linux/appimage/*.AppImage)
          test "${#windows_artifacts[@]}" -eq 1
          test "${#macos_artifacts[@]}" -eq 1
          test "${#linux_artifacts[@]}" -eq 1
          artifacts=("${windows_artifacts[@]}" "${macos_artifacts[@]}" "${linux_artifacts[@]}")
          for artifact in "${artifacts[@]}"; do
            test -s "$artifact.sig"
            decoded_signature="$artifact.minisign-decoded"
            base64 --decode "$artifact.sig" > "$decoded_signature"
            minisign -Vm "$artifact" -p updater.pub -x "$decoded_signature"
            rm -f "$decoded_signature"
          done
      - name: Write QUICKSTART
        run: |
          cat > QUICKSTART.txt <<'EOF'
          veilweave CLI — quick deploy / 快捷部署
          ======================================

          This archive is the CLI + prebuilt workers. For the full desktop app
          (installer / DMG / auto-update), download it from the release page
          instead: https://github.com/jacek4yang/veilweave/releases/latest

          EN: run `./veilweave-tools deploy` in a terminal — the wizard adds a
          Cloudflare account (API token), plans the topology, and deploys
          directly via the Cloudflare API. No Rust, Node, or wrangler needed.
          `veilweave-tools manage` lists/deletes deployments.
          Advanced: `veilweave-tools bundle` generates wrangler-ready folders.

          中文：本包为命令行版 + 预编译 worker。完整桌面应用（安装包/DMG/自动
          更新）请在 release 页面下载。终端运行 `./veilweave-tools deploy`
          按向导添加账号（API Token）、规划拓扑并直接通过 Cloudflare API 部署，
          无需 Rust/Node/wrangler。`veilweave-tools manage` 管理已有部署。
          高级用法：`veilweave-tools bundle` 生成 wrangler 手动部署目录。
          EOF
      - name: Assemble per-platform archives
        run: |
          set -euo pipefail
          mkdir -p out
          for platform in windows-x64 linux-x64 macos-arm64; do
            pkg="veilweave-${TAG}-${platform}"
            mkdir -p "$pkg"
            cp -r artifacts/worker-bundles/bundle "$pkg/bundle"
            cp artifacts/tools-${platform}/veilweave-tools* "$pkg/"
            cp QUICKSTART.txt "$pkg/"
            chmod +x artifacts/tools-linux-x64/veilweave-tools
            artifacts/tools-linux-x64/veilweave-tools worker-bundle validate \
              --role relay --dir "$pkg/bundle/relay"
            artifacts/tools-linux-x64/veilweave-tools worker-bundle validate \
              --role sub --dir "$pkg/bundle/sub"
            test ! -e "$pkg/bundle/relay/package.json"
            test ! -e "$pkg/bundle/sub/package.json"
            if [ "$platform" = "windows-x64" ]; then
              (cd "$pkg" && zip -qr "../out/${pkg}.zip" .)
            else
              chmod +x "$pkg"/veilweave-tools
              tar -czf "out/${pkg}.tar.gz" "$pkg"
            fi
            rm -rf "$pkg"
          done
          ls -la out/
      - name: Stage desktop app installers + build latest.json (updater manifest)
        run: |
          set -euo pipefail
          cp artifacts/app-windows/nsis/*.exe out/ 2>/dev/null || true
          cp artifacts/app-windows/nsis/*.sig out/ 2>/dev/null || true
          cp artifacts/app-windows/msi/*.msi out/ 2>/dev/null || true
          cp artifacts/app-macos/dmg/*.dmg out/ 2>/dev/null || true
          cp artifacts/app-macos/macos/*.tar.gz out/ 2>/dev/null || true
          cp artifacts/app-macos/macos/*.sig out/ 2>/dev/null || true
          cp artifacts/app-linux/appimage/*.AppImage out/ 2>/dev/null || true
          cp artifacts/app-linux/appimage/*.sig out/ 2>/dev/null || true
          cp artifacts/app-linux/deb/*.deb out/ 2>/dev/null || true

          python3 - "$TAG" <<'PYEOF'
          import glob, json, os, sys
          tag = sys.argv[1]
          version = tag.lstrip("v")
          base = f"https://github.com/jacek4yang/veilweave/releases/download/{tag}"
          def sig(pattern):
              hits = glob.glob(pattern)
              return open(hits[0], encoding="utf-8").read().strip() if hits else None
          def asset(pattern):
              hits = glob.glob(pattern)
              return os.path.basename(hits[0]) if hits else None
          platforms = {}
          entries = [
              ("windows-x86_64", "artifacts/app-windows/nsis/*.exe", "artifacts/app-windows/nsis/*.sig"),
              ("darwin-aarch64", "artifacts/app-macos/macos/*.tar.gz", "artifacts/app-macos/macos/*.sig"),
              ("linux-x86_64", "artifacts/app-linux/appimage/*.AppImage", "artifacts/app-linux/appimage/*.sig"),
          ]
          for name, asset_pat, sig_pat in entries:
              a, s = asset(asset_pat), sig(sig_pat)
              if a and s:
                  platforms[name] = {"signature": s, "url": f"{base}/{a}"}
          manifest = {
              "version": version,
              "notes": f"veilweave {tag}",
              "pub_date": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
              "platforms": platforms,
          }
          with open("out/latest.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2)
          print(json.dumps(manifest, indent=2))
          expected = {"windows-x86_64", "darwin-aarch64", "linux-x86_64"}
          assert set(platforms) == expected, f"incomplete updater platforms: {set(platforms)}"
          for platform in platforms.values():
              assert platform["signature"], "empty updater signature"
              assert os.path.isfile(os.path.join("out", os.path.basename(platform["url"]))), "updater URL asset was not staged"
          PYEOF
          ls -la out/
      - name: Generate release SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: out
          format: cyclonedx-json
          output-file: out/veilweave-${{ env.TAG }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate SHA-256 checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS
      - name: Create release
        run: |
          # Idempotent: re-running for an existing tag just re-uploads assets.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
            exit 0
          fi
          args=(--title "$TAG" --generate-notes)
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            gh release create "$TAG" out/* "${args[@]}"
          else
            gh release create "$TAG" out/* "${args[@]}" --target "${{ github.sha }}"
          fi
