name: Release

# Tag push (v*) builds and publishes a GitHub Release containing, per platform:
#   veilweave-tools[.exe]      — native CLI (gen-secret / gen-link / bundle)
#   bundle/relay, bundle/sub   — PREBUILT workers (worker-build output)
# End users never touch a Rust toolchain: download the archive, double-click the
# executable (or run `veilweave-tools bundle`), then `wrangler deploy` the
# generated folders.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

env:
  CARGO_TERM_COLOR: always

jobs:
  tools:
    name: tools · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64, ext: ".exe" }
          - { os: ubuntu-latest,  name: linux-x64,   ext: "" }
          - { os: macos-latest,   name: macos-arm64, ext: "" }
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools -> target
      - name: cargo build --release
        working-directory: tools
        run: cargo build --release --locked
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p stage
          cp "tools/target/release/veilweave-tools${{ matrix.ext }}" stage/
      - name: Upload tools artifact
        uses: actions/upload-artifact@v4
        with:
          name: tools-${{ matrix.name }}
          path: stage/
          if-no-files-found: error

  workers:
    name: workers · prebuilt relay + sub bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workers
          workspaces: |
            relay -> target
            sub -> target
      - name: Install worker-build
        run: cargo install -q "worker-build@^0.8" --locked
      - name: Build relay worker
        working-directory: relay
        run: worker-build --release
      - name: Build sub worker
        working-directory: sub
        run: worker-build --release
      - name: Stage bundles
        run: |
          mkdir -p stage/bundle/relay stage/bundle/sub
          cp -r relay/build stage/bundle/relay/build
          cp -r sub/build   stage/bundle/sub/build
          test -f stage/bundle/relay/build/index.js
          test -f stage/bundle/sub/build/index.js
      - name: Upload worker bundles
        uses: actions/upload-artifact@v4
        with:
          name: worker-bundles
          path: stage/
          if-no-files-found: error

  release:
    name: publish GitHub Release
    runs-on: ubuntu-latest
    needs: [tools, workers]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Write QUICKSTART
        run: |
          cat > QUICKSTART.txt <<'EOF'
          veilweave — quick deploy / 快捷部署
          ====================================

          EN: Double-click veilweave-tools (.exe) — or run `./veilweave-tools bundle`
          in a terminal. It writes ready-to-deploy workers into `dist/` with fresh
          secrets and randomized names. Then, for each generated folder:

              wrangler deploy

          The sub worker also needs a KV namespace — follow the steps printed by
          the tool. Details: https://github.com/jacek4yang/veilweave#readme

          中文：双击 veilweave-tools(.exe)，或在终端运行 `./veilweave-tools bundle`。
          它会在 `dist/` 下生成可直接部署的 worker 目录（全新密钥 + 随机名称，
          每次运行产物哈希均不相同）。然后进入生成的目录执行 `wrangler deploy`，
          并按工具输出的提示为 sub 创建 KV。详见仓库 README。
          EOF
      - name: Assemble per-platform archives
        run: |
          set -euo pipefail
          mkdir -p out
          for platform in windows-x64 linux-x64 macos-arm64; do
            pkg="veilweave-${TAG}-${platform}"
            mkdir -p "$pkg"
            cp -r artifacts/worker-bundles/bundle "$pkg/bundle"
            cp artifacts/tools-${platform}/veilweave-tools* "$pkg/"
            cp QUICKSTART.txt "$pkg/"
            if [ "$platform" = "windows-x64" ]; then
              (cd "$pkg" && zip -qr "../out/${pkg}.zip" .)
            else
              chmod +x "$pkg"/veilweave-tools
              tar -czf "out/${pkg}.tar.gz" "$pkg"
            fi
            rm -rf "$pkg"
          done
          ls -la out/
      - name: Create release
        run: |
          # Idempotent: re-running for an existing tag just re-uploads assets.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
            exit 0
          fi
          args=(--title "$TAG" --generate-notes)
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            gh release create "$TAG" out/* "${args[@]}"
          else
            gh release create "$TAG" out/* "${args[@]}" --target "${{ github.sha }}"
          fi
