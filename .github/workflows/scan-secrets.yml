name: Scan for secrets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Detect any committed live SECRET_KEY / VEILWEAVE_NODES blob / token.
# The committed wrangler.toml files contain placeholders; the regex here
# matches an actually-issued blob (base64url starting with Vlcx…).
jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
