[package]
name = "veilweave-core"
version = "2.0.2"
edition = "2021"

# Shared deploy core: Cloudflare API client, persistent config, deploy
# orchestration, secret/blob helpers, and account recovery. UI-agnostic —
# consumed by the veilweave-tools CLI and the Tauri app.
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "multipart",
    "socks",
    "system-proxy",
] }
rand = "0.8"
base64 = "0.22"
x25519-dalek = { version = "2", features = ["static_secrets"] }
sha2 = "0.10"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }
keyring = { version = "3.6.3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }
tokio = { version = "1", features = ["net", "time", "macros", "rt", "io-util", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
idna = "1"

[dev-dependencies]
rcgen = "0.14"
tokio-rustls = "0.26"
